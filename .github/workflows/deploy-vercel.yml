# PRIMARY production deployer. Local → push to main → this deploys to Vercel.
#
# On every push to main it runs `vercel deploy --prod` (REMOTE build), which runs
# `vercel-build`: vitest → vite build → prerender, failing the deploy on any error.
# Also runnable by hand from the Actions tab (workflow_dispatch).
#
# NO DOUBLE-DEPLOY RACE: Vercel's own Git integration is disabled for main
# (client/vercel.json → git.deploymentEnabled: { "main": false }), so Vercel does
# NOT auto-deploy production — only this workflow does. Vercel still builds PR
# PREVIEW deployments for other branches, so client regressions surface on PRs.
#
# WHY TOKEN-AUTH (not Vercel's git integration for prod): the Vercel project sits
# on a Hobby team, and the git integration blocks deployments whose commit author
# isn't the team owner ("does not have contributing access"). Token-authenticated
# CLI deploys run AS the owner and bypass that check — so bot/co-author commits
# still ship.
#
# FALLBACK if this workflow can't run — e.g. the Actions spending limit is
# exhausted, jobs refused before checkout ("recent account payments have failed
# or your spending limit needs to be increased"): deploy production by hand.
#   - Vercel dashboard → Deployments → Redeploy the latest main commit, OR
#   - from a machine with the Vercel CLI, at the REPO ROOT (project dir is `client`):
#       npx vercel deploy --prod
#
# REQUIRED SECRET (GitHub repo → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN — create at vercel.com → Account Settings → Tokens.
# Org/project IDs are not secrets; they are pinned below.

name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
    # Only the CLIENT ships to Vercel. Server-only / docs-only / workflow-only
    # merges (the server deploys separately to Render) skip this ~13-min build
    # entirely — the single biggest Actions-minute saver. A merge that touches
    # both client and server still deploys (client path matched). Manual
    # workflow_dispatch has no path filter, so a forced re-deploy always runs.
    paths:
      - 'client/**'
      # docs/help is the ONE docs directory that ships in the client bundle:
      # client/src/content/helpDocs.js inlines it at build time via
      # import.meta.glob, and the /help/docs/* pages prerender from it. Without
      # this line a help-article-only merge never redeploys, so /help keeps
      # serving the previous text indefinitely while Bolt (reseeded from the
      # same files) moves on. Every other docs/ directory is still skipped.
      - 'docs/help/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  # THIS project's Vercel IDs (not secrets; pinned here). From the Vercel dashboard
  # or `vercel project inspect`. The VERCEL_TOKEN repo secret (GitHub → Settings →
  # Secrets and variables → Actions) authenticates the deploy and MUST be set, or
  # this job fails with an auth error and prod never updates.
  VERCEL_ORG_ID: team_uxnH0xiRg1CUjgcNL1rxf0MJ
  VERCEL_PROJECT_ID: prj_G0HSyvMvRWt7doXpU7MRImSLgY5u

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Parent commit too, so the wait step can diff this push against it.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # DEPLOY RACE: the remote build's prerender reads the API's sitemap and
      # pages. When a merge changes server/ too, Render redeploys the API in
      # parallel; if Vercel builds first it bakes against the OLD API (the new
      # profile tab URLs shipped as bare SPA shells on 2026-11-27 that way). So
      # when this commit touches server/, wait until Render's /health reports
      # this commit (RENDER_GIT_COMMIT, prefix match) before deploying. Bounded
      # at ~25 min; on timeout deploy anyway with a warning. No secrets needed.
      - name: Wait for Render to serve this commit (only when server/ changed)
        run: |
          if git rev-parse -q --verify HEAD^1 >/dev/null && git diff --quiet HEAD^1 HEAD -- server/; then
            echo "No server/ change in ${GITHUB_SHA:0:7}; not waiting for Render."
            exit 0
          fi
          deadline=$(( $(date +%s) + 1500 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            live=$(curl -fsS --max-time 20 https://meeticulous-api.onrender.com/health \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).commit||""))}catch{}})' \
              || true)
            if [ -n "$live" ]; then
              case "$GITHUB_SHA" in "$live"*) echo "Render serves ${live:0:7}; deploying."; exit 0 ;; esac
            fi
            echo "Render reports '${live:-unknown}', waiting for ${GITHUB_SHA:0:7}..."
            sleep 30
          done
          echo "::warning::Render did not report ${GITHUB_SHA:0:7} within 25 min; deploying anyway, the prerender may bake against the previous API."

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Build REMOTELY on Vercel (no `vercel build` + `--prebuilt`). Local CI
      # builds via `vercel pull` cannot access env vars marked Sensitive in the
      # Vercel dashboard, so the 2026-07-08 deploy shipped a bundle with no
      # VITE_* vars baked in — a total white screen. Remote builds run inside
      # Vercel's infra where ALL project env vars (sensitive included) exist,
      # and run `vercel-build`, so the tests + prerender gate apply here too.
      #
      # --no-wait: queue the deploy and return immediately instead of blocking
      # the runner for the whole ~11-32 min REMOTE build. The GitHub runner was
      # idling (and billing Actions minutes) the entire build before this —
      # ~30 wasted GH-minutes per client deploy. The build still runs on Vercel;
      # its pass/fail shows on the Vercel dashboard, and smoke.yml (triggered by
      # deployment_status) only fires on a SUCCESSFUL deploy, so a failed remote
      # build never false-passes a canary. Trade-off: this job goes green even
      # if the remote build later fails — watch Vercel, not just Actions.
      - name: Deploy (remote build, fire-and-forget)
        run: vercel deploy --prod --no-wait --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel Hobby caps Deployment Storage at 10 GB, and Vercel keeps every
      # deployment forever. Each production build stores ~50 MB of prerendered
      # output, so at ~2.3 deploys/day storage grew ~3.3 GB/month: 64 retained
      # deployments had already eaten 3.09 GB by 2026-11-25 and would have hit
      # the cap (= project PAUSED, site down) in early Feb 2027. A one-off prune
      # that day freed ~3.0 GB; this step stops it coming back.
      #
      # Keeps the newest KEEP deployments as rollback targets, and ALWAYS keeps
      # whatever currently serves PROD_ALIAS even if it has aged out of that
      # window — deleting the live deployment would take production down.
      # Runs on failure too: a failed deploy still leaves storage to reclaim.
      # continue-on-error so housekeeping can never be the reason a deploy is
      # reported broken; check this step's log if storage starts climbing again.
      #
      # Plain node, no jq: the runner already has node, so the same script runs
      # locally (`node scripts/pruneVercelDeployments.mjs --dry-run`) and what
      # ships is what was tested.
      - name: Prune old deployments
        if: always()
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PRUNE_KEEP: '5'
        run: node scripts/pruneVercelDeployments.mjs
