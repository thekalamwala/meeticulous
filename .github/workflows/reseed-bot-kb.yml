name: Reseed Tithi KB

# Rebuilds the two prod tables the Tithi support bot answers from — which a normal
# deploy does NOT touch, so editing the sources changes nothing until this runs:
#   - kb_chunks  ← docs/help/*.md            (retrieval corpus, via seedKnowledgeBase.js)
#   - bot_faqs   ← server/scripts/data/botFaqs.json (canned FAQ layer, via seedBotFaqs.js)
#
# Fires when a merge to main changes those sources, or on demand (workflow_dispatch).
#
# Required repo secrets (already present — host-og-cards.yml uses the same two):
#   PROD_SUPABASE_URL, PROD_SUPABASE_SERVICE_ROLE_KEY
# Optional:
#   VOYAGE_API_KEY — without it, kb_chunks seed FTS-only (no vector search) until a
#   later run supplies it. Both scripts are idempotent (clear + reinsert).
#
# NOTE: this targets whatever DB the PROD_* secrets point at. Staging is reseeded
# separately (run the scripts locally against the staging .env).

on:
  push:
    branches: [main]
    paths:
      - "docs/help/**"
      - "server/scripts/seedKnowledgeBase.js"
      - "server/scripts/seedBotFaqs.js"
      - "server/scripts/data/botFaqs.json"
  workflow_dispatch:

# Default is read-only; the failure alert opens/updates an ops-alert issue.
permissions:
  contents: read
  issues: write

concurrency:
  group: reseed-bot-kb
  cancel-in-progress: false

jobs:
  reseed:
    name: Reseed kb_chunks + bot_faqs (prod)
    runs-on: ubuntu-latest
    # Never run on forks — the secrets aren't there and it would just fail noisily.
    if: github.repository == 'thekalamwala/meeticulous'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # ASH-89/#7: fail fast BEFORE touching prod if a prod secret is missing OR is
      # the wrong role (anon/publishable pasted into the service_role slot — the exact
      # bug that silently broke this reseed). Decodes the JWT `role` claim.
      - name: Secret guard (presence + service_role)
        run: |
          bash scripts/check-prod-secrets.sh
          [ -z "$VOYAGE_API_KEY" ] && echo "::warning::VOYAGE_API_KEY not set — kb_chunks will be FTS-only (no embeddings)." || true
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Reseed kb_chunks + bot_faqs
        run: |
          node scripts/seedKnowledgeBase.js
          node scripts/seedBotFaqs.js
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # Both seed scripts only ever use supabaseAdmin, but config/supabase.js
          # eagerly constructs the PUBLIC anon client at require time as well, and
          # createClient throws "supabaseKey is required" on an empty key. With no
          # anon key in this job, every run died on the first require — before the
          # delete, so nothing was lost, but nothing was ever reseeded either. The
          # anon client is never called here, so any non-empty value satisfies
          # construction without granting anything; a real key would add a secret
          # to manage for no benefit. Deliberately NOT fixed in config/supabase.js:
          # on the live server a missing anon key SHOULD fail loudly.
          SUPABASE_ANON_KEY: unused-by-seed-scripts

      # ASH-89/#7 Part 3: a failed prod-writing run must be LOUD, not a red run nobody
      # sees. Reuses GitHub (the existing channel) with the default token — no new
      # secret: opens one deduped `ops-alert` issue (reused while open) that pings
      # watchers. Upgrade to a WhatsApp/Brevo push later by adding that key as a secret.
      - name: Alert ops on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'ops-alert: Reseed Tithi KB failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Reseed Tithi KB** failed on \`${context.ref}\` — the bot KB (kb_chunks + bot_faqs) may be stale.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Most likely a missing/wrong-role prod secret (the guard step prints which) — fix it in Settings → Secrets and re-run. This issue auto-dedupes while open.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'ops-alert', per_page: 100,
            });
            const hit = existing.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({ owner, repo, issue_number: hit.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['ops-alert'] });
            }
