name: Tax/Legal sign-off gate

# Guardrail #2 (agent-fleet plan). A PR that changes tax / TDS / TCS / GST /
# commission / payout / invoice logic must carry an explicit human sign-off before
# it can merge. CI being green does NOT catch a WRONG tax rate — only a human/CA can.
# Origin: #258 shipped a §206AA 5% no-PAN TDS rate that contradicted the CA's actual
# rule (flat 1% TDS + 1% TCS for all). This gate forces that authorization to be cited.
#
# Pass conditions (either one):
#   - a "Sign-off: <name/date — what was approved>" line in the PR body, OR
#   - the `tax-signoff` label on the PR.

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require sign-off on tax/legal/money changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # Files that encode money/legal rules, and patterns that signal a rate/term change.
          SENSITIVE_FILES='server/lib/pricingEngine\.js|invoice|tax'
          SENSITIVE_PATTERNS='tdsRate|tcsRate|\bTDS\b|\bTCS\b|206AA|194-O|gstRate|commission_percentage|\bpayout\b'

          # THREE dots, not two. "git diff A B" compares the two tips, so once the
          # release train moves ahead of where a branch was cut, every commit on the
          # train but not on the branch shows up here as a DELETION - and the greps
          # below then match tax words inside other people's merged work. That is a
          # gate firing on PRs that touch nothing of the sort, which is how a gate
          # stops being read.
          #
          # "A...B" diffs from the MERGE BASE, which is what the PR actually proposes
          # and what GitHub's own Files-changed tab shows. fetch-depth: 0 above is
          # what makes the merge base available here.
          #
          # Measured on PR #373 (a one-file docs change) while the train was 7 commits
          # ahead of main: two-dot saw 36 files and failed the gate; three-dot sees 1
          # file and 0 pattern matches.
          changed="$(git diff --name-only "$BASE"..."$HEAD" || true)"
          # THE FILENAME SIGNAL IS SERVER-ONLY. The patch signal is not.
          #
          # SENSITIVE_FILES carries bare words -- `invoice`, `tax` -- so with no path
          # filter it matched any path containing them anywhere in the repo.
          # client/src/pages/GuestInvoices.jsx failed this gate (PR #364): a React
          # page that DISPLAYS invoices, tripping a check meant for logic that
          # COMPUTES tax. The CA ruling of 2026-11-17 draws exactly that line -- a
          # change which only presents a withheld figure needs presentation review,
          # not tax sign-off. The gate already agreed with itself on the other half:
          # hit_patch was scoped to server/** from the start. The filename check was
          # simply never scoped to match.
          #
          # This workflow stays in scope though it is not under server/. A change to
          # the gate IS a change to the control, and in #374 it correctly refused to
          # clear itself; that property is kept on purpose, not lost as a side
          # effect of scoping.
          #
          # The patch check goes the OTHER way and now reads client/** as well. A
          # rate hardcoded into a React component is a tax change wherever it lives,
          # and the gate could not see one at all before: a client file whose name
          # holds neither "invoice" nor "tax" passed both checks. Verified by
          # building exactly that file -- old gate PASS, new gate FAIL -- while a
          # server invoice file with no sensitive words in it still fails on its
          # name, and the real tax branches still fail on their patch.
          hit_file="$(printf '%s\n' "$changed" | grep -E '^server/|^[.]github/workflows/tax-legal-signoff[.]yml$' | grep -Ei "$SENSITIVE_FILES" || true)"
          hit_patch="$(git diff "$BASE"..."$HEAD" -- 'server/**' 'client/**' | grep -E '^[+-]' | grep -iE "$SENSITIVE_PATTERNS" | head -20 || true)"

          if [ -z "$hit_file" ] && [ -z "$hit_patch" ]; then
            echo "No tax/legal/money-sensitive changes detected. OK."
            exit 0
          fi

          echo "::group::Tax/legal/money-sensitive changes in this PR"
          [ -n "$hit_file" ] && { echo "Files:"; printf '%s\n' "$hit_file"; }
          [ -n "$hit_patch" ] && { echo "Lines:"; printf '%s\n' "$hit_patch"; }
          echo "::endgroup::"

          if printf '%s' "$LABELS" | grep -q 'tax-signoff'; then
            echo "'tax-signoff' label present — authorized. OK."
            exit 0
          fi
          if printf '%s' "$BODY" | grep -qiE '^[[:space:]]*Sign-?off:[[:space:]]*\S'; then
            echo "Sign-off line present in PR body — authorized. OK."
            exit 0
          fi

          echo "::error::This PR changes tax/TDS/TCS/GST/commission/payout/invoice logic. Add a 'Sign-off: <name/date — what was approved>' line to the PR body OR the 'tax-signoff' label, citing the human/CA authorization. (See #258: a 5% TDS rate shipped that contradicted the CA's flat 1%+1% rule.)"
          exit 1
