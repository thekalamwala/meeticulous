# Base JMeter properties — defaults for every test plan.
# Override per-environment with `-q config/local.properties` (or staging),
# and per-scenario with -J flags from performance/scripts/run.js.

# ── Target ──
base.protocol=http
base.host=localhost
base.port=5000

# ── Scenario knobs (run.js overrides these per scenario) ──
threads=10
rampup=30
duration=60

# ── Auth / data ──
# vendortoken (NO dot — dotted -J names get mangled by some shells) is minted by
# server/scripts/mintVendorToken.js; run.js injects it from $VENDOR_TOKEN.
# Empty → vendor-flow returns 401 (run it only with a token set).
vendortoken=
# paid=true enables the booking-flow paid (Razorpay) sub-path; default free-only.
paid=false
