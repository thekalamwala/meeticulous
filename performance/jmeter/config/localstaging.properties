# Local server wired to the ISOLATED STAGING Supabase project (not prod).
# Used to run the >250-thread stages safely: the server on localhost:5599 talks to
# the staging DB, so the production safety cap (env=local) does not apply here.
# Boot the server with NODE_ENV=staging + LOAD_TEST_MODE=true + staging Supabase creds.
# Run with PERF_ALLOW_LARGE_RUN=1 (acknowledges an isolated target). See STAGING_SETUP.md.
base.protocol=http
base.host=localhost
base.port=5599
