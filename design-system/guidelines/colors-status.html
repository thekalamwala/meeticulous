<!-- @dsCard group="Colors" viewport="700x150" name="Booking status & feedback" subtitle="Pink dot = booked. Marigold = open. Never decorative." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-page);padding:24px;font-family:var(--font-body);color:var(--fg-1)}.row{display:flex;gap:12px}.lbl{font-size:12px;line-height:1.35;color:var(--fg-2)}.lbl b{color:var(--fg-1);font-weight:600}</style></head><body><div class="row"><div style="flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="mt-badge mt-badge--booked"><span class="mt-badge__dot"></span>Booked</span><span class="lbl">--status-booked</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="mt-badge mt-badge--open"><span class="mt-badge__dot"></span>Open</span><span class="lbl">--status-open</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="mt-badge mt-badge--busy">Busy</span><span class="lbl">--status-busy</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="mt-badge mt-badge--success">Success</span><span class="lbl">--success</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="mt-badge mt-badge--warning">Warning</span><span class="lbl">--warning</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="mt-badge mt-badge--danger">Danger</span><span class="lbl">--danger</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="mt-badge mt-badge--info">Info</span><span class="lbl">--info</span></div></div><p class="lbl" style="margin-top:14px">Rose on cream is 3.6:1 — display text ≥24px only. Body text in maroon or ink.</p></body></html>
