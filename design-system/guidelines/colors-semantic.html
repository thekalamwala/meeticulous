;justify-content:space-between;border:1px solid var(--border-1)"><b style="font-family:var(--font-display);font-size:18px">Brand strong</b><span style="font-size:11px;opacity:.85">--bg-brand-strong<br>--fg-on-brand-accent</span></div><div style="flex:1;border-radius:14px;padding:14px;background:var(--bg-inverse);color:var(--fg-on-brand-2);display:flex;flex-direction:column;gap:4px;min-height:96px;justify-content:space-between;border:1px solid var(--border-1)"><b style="font-family:var(--font-display);font-size:18px">Inverse</b><span style="font-size:11px;opacity:.85">--bg-inverse<br>--fg-on-brand-2</span></div></div></body></html>
