<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Meeticulous announcement: a booking calendar on a maroon field">
  <!-- Variant C (refined) — "Maroon marquee". Maroon field, pink ee motif, a cream
       calendar panel of slot cells (mostly open, a few booked + paid, one open in
       marigold, one selected). Official ee + camera+calendar reused. Tokens only. -->
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#3D0516" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" rx="48" fill="#960D32"/>

  <!-- official ee, pink, bleeding top-right, motif -->
  <g transform="translate(610,-120) scale(4.9)" opacity="0.18">
    <path transform="translate(-4.8 0) skewX(5)" d="M14 63 C30 62 55 56 62 44 C68 30 55 18 42 22 C25 27 18 50 22 68 C26 86 50 92 72 78 C90 66 110 58 122 46 C130 34 118 18 104 22 C88 27 80 50 84 68 C88 86 112 92 138 74" fill="none" stroke="#FF9FB0" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- megaphone (announcement), pink, top-left on the field -->
  <svg x="120" y="128" width="148" height="148" viewBox="0 0 24 24">
    <path d="M3 11l18-5v14L3 15v-4zM11.6 16.8a3 3 0 11-5.8-1.6" fill="none" stroke="#FF9FB0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <circle cx="300" cy="150" r="10" fill="#FF9FB0"/>
  <circle cx="340" cy="196" r="7" fill="#FF9FB0" opacity="0.7"/>

  <!-- cream calendar panel, lifted off the field -->
  <rect x="140" y="320" width="920" height="664" rx="40" fill="#FBF5F3" filter="url(#lift)"/>

  <!-- panel header: camera+calendar (official, maroon) + hairline rule -->
  <svg x="184" y="360" width="104" height="88" viewBox="5 11 90 76">
    <g fill="none" stroke="#960D32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 26 H58 Q68 26 68 36 V44 L88 32 V74 L68 62 V70 Q68 80 58 80 H22 Q12 80 12 70 V36 Q12 26 22 26 Z"/>
      <path d="M28 18 V32 M52 18 V32"/>
    </g>
    <circle cx="30" cy="57" r="6.5" fill="#FF9FB0"/>
  </svg>
  <line x1="184" y1="476" x2="1016" y2="476" stroke="#EBD6D4" stroke-width="2"/>

  <!-- connector thread between the two booked slots -->
  <path d="M343,548 C 430,640 480,700 558,772" fill="none" stroke="#960D32" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- slot grid 4 x 2 (cellW 187, cellH 196, gap 28) -->
  <!-- Row 1 -->
  <rect x="184" y="520" width="187" height="196" rx="28" fill="#960D32"/>
  <circle cx="343" cy="548" r="11" fill="#FF9FB0"/>
  <rect x="399" y="520" width="187" height="196" rx="28" fill="none" stroke="#EBD6D4" stroke-width="2"/>
  <rect x="614" y="520" width="187" height="196" rx="28" fill="#F6C35A"/>
  <rect x="829" y="520" width="187" height="196" rx="28" fill="none" stroke="#EBD6D4" stroke-width="2"/>
  <!-- Row 2 -->
  <rect x="184" y="744" width="187" height="196" rx="28" fill="none" stroke="#EBD6D4" stroke-width="2"/>
  <rect x="399" y="744" width="187" height="196" rx="28" fill="#960D32"/>
  <circle cx="558" cy="772" r="11" fill="#FF9FB0"/>
  <rect x="614" y="744" width="187" height="196" rx="28" fill="none" stroke="#EBD6D4" stroke-width="2"/>
  <rect x="823" y="738" width="199" height="208" rx="34" fill="none" stroke="#E0506F" stroke-width="3"/>
  <rect x="829" y="744" width="187" height="196" rx="28" fill="#FFFFFF" stroke="#EBD6D4" stroke-width="2"/>
</svg>
