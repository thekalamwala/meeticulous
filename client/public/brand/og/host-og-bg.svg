<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand (maroon) ground for the host share card. White logo + text overlay on
       top. A vertical pink 'ee' ribbon runs down the right side (~13% off the
       right edge). The backdrop is a faint scheduling motif — calendar cells +
       product glyphs (clock, chat, rupee, video) — brand filler, never structural. -->
  <rect width="1200" height="630" fill="#960D32"/>

  <!-- Scheduling backdrop: faint calendar cells (top band) + product glyphs,
       kept to the centre/left so content and the right-side ribbon stay clean. -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2">
    <!-- calendar cells -->
    <g>
      <rect x="430" y="70" width="60" height="60" rx="14"/>
      <rect x="520" y="70" width="60" height="60" rx="14"/>
      <rect x="610" y="70" width="60" height="60" rx="14"/>
      <rect x="475" y="160" width="60" height="60" rx="14"/>
      <rect x="565" y="160" width="60" height="60" rx="14"/>
    </g>
    <!-- clock -->
    <g transform="translate(150 470)"><circle cx="0" cy="0" r="34"/><path d="M0 0 V-20 M0 0 L14 8" stroke-linecap="round"/></g>
    <!-- chat bubble -->
    <g transform="translate(300 110) scale(0.9)"><path d="M0 0 h78 a14 14 0 0 1 14 14 v34 a14 14 0 0 1 -14 14 h-46 l-20 18 v-18 a14 14 0 0 1 -6 -12 v-36 a14 14 0 0 1 0 -14 z" stroke-linejoin="round"/></g>
    <!-- video -->
    <g transform="translate(930 470)"><rect x="0" y="0" width="74" height="54" rx="12"/><path d="M78 16 L104 2 V52 L78 38 Z"/></g>
  </g>
  <!-- rupee + faint dots -->
  <g fill="#FFFFFF" fill-opacity="0.06">
    <text x="760" y="150" font-family="Poppins, sans-serif" font-size="70" font-weight="700" fill-opacity="0.05">&#8377;</text>
    <circle cx="240" cy="250" r="7"/><circle cx="700" cy="330" r="6"/><circle cx="110" cy="160" r="9"/>
  </g>

  <!-- ee ribbon (home hero) in pink, VERTICAL on the right side (~x=1040, 13% off
       the right edge): the stroke runs top->bottom, loops into the cursive 'ee'
       around mid-height. Loop centre (~75,55 in the path's own coords) maps to
       (1040,320) and the whole mark is rotated 90deg to stand vertical. -->
  <g transform="translate(1040,320) rotate(90) scale(1.25) translate(-75,-55)">
    <path transform="translate(-4.8 0) skewX(5)"
      d="M-1200 63 L14 63 C30 62 55 56 62 44 C68 30 55 18 42 22 C25 27 18 50 22 68 C26 86 50 92 72 78 C90 66 110 58 122 46 C130 34 118 18 104 22 C88 27 80 50 84 68 C88 86 112 92 138 74 C150 66 164 63 190 63 L480 63"
      fill="none" stroke="#FF9FB0" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
